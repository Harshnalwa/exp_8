name: ML pipeline
on:
  push:
    branches:[main]
  workflow_dispatch:

jobs:
    train-and-test:
      runs-on: ubuntu-latest
      steps:
        - name:Download Project code
          uses: actions/checkout@v4
        - name: Set up Python
          uses: actions/setup-python@v4
          with:
            python-version: "3.11"
        - name: Install libraries/dependencies
          run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt 
        - name: ML model Training 
          run: |
              python train.py    
        - name: ML model Testing
          run: |
              python test.py